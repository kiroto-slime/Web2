<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 小遊戲</title>
    <script>(function(){try{var p=localStorage.getItem('dh-theme')||'dark';var t=p==='system'?((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'):p;document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <style>
        .gb-cell{width:48px;height:48px;border:2px solid var(--bs-border-color);border-radius:6px;font-size:22px;text-transform:uppercase;}
        .gb-correct{background:#3fb950;border-color:#3fb950;color:#fff;}
        .gb-present{background:#d29922;border-color:#d29922;color:#fff;}
        .gb-absent{background:#484f58;border-color:#484f58;color:#fff;}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link active" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container-xxl text-center" style="max-width:520px">
            <h1 class="fw-bold mb-1">🎮 密碼破解</h1>
            <p class="text-muted small mb-4">猜出 4 個字母的資安單字，共 6 次機會！<br>綠 = 位置正確，黃 = 有這個字母但位置錯，灰 = 沒有這個字母。</p>
            <div id="gbBoard" class="mb-3"></div>
            <div class="d-flex gap-2 justify-content-center mb-2">
                <input id="gbInput" class="form-control text-center" maxlength="4" autocomplete="off" style="max-width:160px;text-transform:uppercase" placeholder="4 字母">
                <button id="gbGuess" class="btn btn-primary">猜</button>
                <button id="gbRestart" class="btn btn-outline-secondary">重玩</button>
            </div>
            <div id="gbMsg" class="mt-3 fw-semibold" style="min-height:24px"></div>
        </div>
    </main>

    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
