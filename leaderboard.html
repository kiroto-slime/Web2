<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 排行榜</title>
    
    <!-- 頁面載入時先檢查用戶的主題設定，立即套用亮/暗色主題 -->
    <script>
        (function () {
            try {
                // 從瀏覽器儲存空間取得主題設定，預設為 'dark'（暗色）
                var t = localStorage.getItem('dh-theme') || 'dark';
                // 設定 HTML 根元素的主題屬性，讓 CSS 立即套用
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <!-- 引入 Bootstrap 框架的 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引���自訂樣式 -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- 引入排行榜專用的樣式 -->
    <link rel="stylesheet" href="css/leaderboard.css">
    <!-- 引入亮色主題覆蓋樣式 -->
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <!-- 動畫粒子效果容器 -->
    <div id="tsparticles"></div>
    
    <!-- 頁面載入動畫 -->
    <div id="loading">
        <img src="image/loading.gif" alt="Loading">
        <img src="image/loading2.gif" alt="Loading">
    </div>
    
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">
                Don't <span class="text-primary">HackMe</span>
            </a>
            <!-- 亮/暗主題切換開關 -->
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            <!-- 手機版導覽列按鈕 -->
            <button class="navbar-toggler border-secondary" type="button"
                    data-bs-toggle="collapse" data-bs-target="#lbNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- 導覽列選單項目 -->
            <div class="collapse navbar-collapse" id="lbNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#rooms">題目庫</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <!-- 排行榜是當前頁面，標記為 active -->
                    <li class="nav-item"><a class="nav-link active" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區域 -->
    <main class="py-5">
        <div class="container-xxl">

            <!-- 頁面標題和房間篩選 -->
            <div class="d-flex align-items-end justify-content-between flex-wrap gap-3 mb-5">
                <div>
                    <h1 class="fw-bold mb-1">🏆 排行榜</h1>
                    <p class="text-muted small mb-0">每次完成房間關卡，成績將自動計入排名</p>
                </div>
                <!-- 房間篩選下拉選單，會由 JavaScript 動態填充房間選項 -->
                <div class="d-flex gap-2 align-items-center">
                    <select class="form-select form-select-sm border-secondary bg-transparent" id="roomFilter"
                            style="width:auto;color:var(--bs-secondary-color)">
                        <option value="all">所有房間</option>
                    </select>
                </div>
            </div>

            <!-- 計分說明：各種得分方式 -->
            <div class="d-flex gap-4 flex-wrap mb-4 p-3 rounded border border-secondary bg-transparent small text-muted">
                <!-- 回答正確題目的基本分數 -->
                <span><span class="badge bg-primary me-1">&nbsp;</span>答題 × 100pts</span>
                <!-- 完成全部房間題目的額外獎勵 -->
                <span><span class="badge bg-success me-1">&nbsp;</span>完成獎勵 +500pts</span>
                <!-- 快速完成房間的時間獎勵 -->
                <span><span class="badge bg-warning text-dark me-1">&nbsp;</span>時間獎勵 最高 +300pts</span>
            </div>

            <!-- 領獎台區域：展示前三名（會由 JavaScript 動態生成） -->
            <div id="podiumWrap" class="mb-5"></div>

            <!-- 完整排行榜表格：所有參賽者的詳細成績 -->
            <div class="card border-secondary">
                <div class="card-header border-secondary text-secondary small fw-semibold">
                    完整排名
                </div>
                <!-- 排行榜表格會由 JavaScript 動態生成 -->
                <div id="lbTableWrap"></div>
            </div>

        </div>
    </main>

    <!-- 頁尾：版權資訊 -->
    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <!-- 引入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入題目和房間資料 -->
    <script src="js/data.js"></script>
    <!-- 引入排行榜邏輯（動態生成表格、篩選、排序） -->
    <script src="js/leaderboard.js"></script>
    <!-- 引入主題切換邏輯 -->
    <script src="js/theme.js"></script>
    <!-- 引入動畫效果 -->
    <script src="js/ani.js"></script>
</body>
</html>
