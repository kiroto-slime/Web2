<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 學習路徑</title>
    
    <!-- 頁面載入時先檢查用戶的主題設定，支援亮/暗/跟隨系統三種模式 -->
    <script>
        (function () {
            try {
                // 取得使用者儲存的主題偏好設定，預設為 'dark'
                var p = localStorage.getItem('dh-theme') || 'dark';
                // 如果選擇「跟隨系統」，則檢查系統是否為亮色或暗色
                var t = p === 'system' ?
                    ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark') : p;
                // 套用主題到 HTML 根元素
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <!-- 引入 Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引入自訂樣式 -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- 引入亮色主題覆蓋樣式 -->
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            
            <!-- 亮/暗主題快速切換開關 -->
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            
            <!-- 手機版導覽列按鈕 -->
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 導覽列選單項目 -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <!-- 學習路徑是當前頁面，標記為 active -->
                    <li class="nav-item"><a class="nav-link active" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區域 -->
    <main class="py-5">
        <div class="container-xxl">
            <!-- 頁面標題 -->
            <h1 class="fw-bold mb-1">學習路徑</h1>
            <p class="text-muted small mb-4">按照路徑系統性地學習，效率最大化</p>
            
            <!-- 學習路徑卡片容器，會由 JavaScript 動態生成 -->
            <div class="row g-3 mb-5" id="pathsGrid"></div>
            
            <!-- 所有房間區塊 -->
            <h2 class="fw-bold mb-3">所有房間</h2>
            <!-- 房間卡片容器，會由 JavaScript 動態生成 -->
            <div class="row g-3" id="roomsGrid"></div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <!-- 引入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入題目和房間資料 -->
    <script src="js/data.js"></script>
    <!-- 引入主題切換邏輯 -->
    <script src="js/theme.js"></script>
    
    <!-- 動態生成學習路徑和房間卡片的邏輯 -->
    <script>
        // 使用 map 函式遍歷所有學習路徑，為每一個生成一張卡片
        document.getElementById('pathsGrid').innerHTML = LEARNING_PATHS.map(function (p) {
            // 每個卡片包含路徑的圖標、標題、描述和房間數量
            return '<div class="col-sm-6 col-xl-3"><div class="card h-100 border-secondary" style="border-top:3px solid ' + p.color + '"><div class="card-body">'
                + '<div class="fs-1 lh-1">' + p.icon + '</div>'
                + '<div class="fw-semibold mt-2">' + p.title + '</div>'
                + '<div class="text-muted small mb-2">' + p.desc + '</div>'
                + '<span class="badge border border-secondary text-secondary fw-normal">' + p.roomCount + ' 個房間</span>'
                + '</div></div></div>';
        }).join('');

        // 使用 map 函式遍歷所有房間，為每一個生成一張卡片
        document.getElementById('roomsGrid').innerHTML = ROOMS.map(function (r) {
            // 房間分為可用和未上線兩種狀態
            // 可用的房間可點選進入，未上線的房間顯示灰色且無法點選
            return '<div class="col-sm-6 col-xl-4"><div class="card h-100 border-secondary' + (r.available ? '' : ' opacity-50') + '"'
                + (r.available ? ' style="cursor:pointer" onclick="location.href=\'' + r.url + '\'\'" : '') + '><div class="card-body">'
                + '<div class="d-flex justify-content-between align-items-start"><span class="fs-2">' + r.icon + '</span>'
                + '<span class="badge bg-secondary">' + r.difficultyLabel + '</span></div>'
                + '<h6 class="fw-bold mt-2">' + r.title + '</h6>'
                + '<p class="text-muted small mb-0">' + r.description + '</p>'
                + (r.available ? '' : '<span class="badge border border-secondary text-secondary mt-2">🔒 即將推出</span>')
                + '</div></div></div>';
        }).join('');
    </script>
</body>
</html>
