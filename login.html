<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 登入</title>
    
    <!-- 頁面載入時先檢查用戶的主題設定，支援亮/暗/跟隨系統三種模式 -->
    <script>
        (function () {
            try {
                // 取得使用者儲存的主題偏好設定，預設為 'dark'
                var p = localStorage.getItem('dh-theme') || 'dark';
                // 如果選擇「跟隨系統」，則檢查系統是否為亮色或暗色
                var t = p === 'system' ? 
                    ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark') : p;
                // 套用主題到 HTML 根元素
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <!-- 引入 Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引入自訂樣式 -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- 引入亮色主題覆蓋樣式 -->
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            
            <!-- 亮/暗主題快速切換開關 -->
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            
            <!-- 手機版導覽列按鈕 -->
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 導覽列選單項目 -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link" href="profile.html">個人</a>
                    <!-- 登入頁面的登入按鈕標記為 active -->
                    <a class="btn btn-outline-primary btn-sm active" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區域 -->
    <main class="py-5">
        <div class="container-xxl" style="max-width:420px">
            <!-- 登入卡片 -->
            <div class="card border-secondary">
                <div class="card-body p-4">
                    <!-- 標題 -->
                    <h1 class="h4 fw-bold mb-1 text-center">登入</h1>
                    <p class="text-muted small text-center mb-4">歡迎回來，駭客</p>
                    
                    <!-- 登入表單 -->
                    <form id="loginForm" novalidate>
                        <!-- 帳號欄位 -->
                        <div class="mb-3">
                            <label class="form-label">帳號</label>
                            <input type="text" class="form-control" id="username" required>
                            <div class="invalid-feedback">請輸入帳號</div>
                        </div>
                        
                        <!-- 密碼欄位（至少 4 個字元） -->
                        <div class="mb-3">
                            <label class="form-label">密碼</label>
                            <input type="password" class="form-control" id="password" required minlength="4">
                            <div class="invalid-feedback">密碼至少 4 個字</div>
                        </div>
                        
                        <!-- 提交按鈕 -->
                        <button class="btn btn-primary w-100" type="submit">登入</button>
                    </form>
                    
                    <!-- 沒有帳號的使用者可點選連結前往註冊頁面 -->
                    <p class="text-center text-muted small mt-3 mb-0">還沒有帳號？<a href="register.html">註冊</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <!-- 引入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入主題切換邏輯 -->
    <script src="js/theme.js"></script>
    
    <!-- 登入表單的驗證和提交邏輯 -->
    <script>
        // 監聽登入表單的提交事件
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            // 阻止表單預設提交行為（避免頁面刷新）
            e.preventDefault();
            
            // 取得帳號和密碼輸入框
            var u = document.getElementById('username');
            var p = document.getElementById('password');
            var ok = true;
            
            // 檢查帳號和密碼欄位是否符合 HTML5 驗證規則
            [u, p].forEach(function (f) {
                if (!f.checkValidity()) {
                    // 如果欄位無效，加上紅色邊框類別來視覺化顯示錯誤
                    f.classList.add('is-invalid');
                    ok = false;
                } else {
                    // 移除錯誤樣式
                    f.classList.remove('is-invalid');
                }
            });
            
            // 如果驗證失敗，停止執行
            if (!ok) return;
            
            // 驗證成功，將帳號名稱儲存到瀏覽器的本地儲存空間
            try {
                localStorage.setItem('dh-user', u.value);
            } catch (e) {}
            
            // 導向個人檔案頁面
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
