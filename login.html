<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 登入</title>
    <script>(function(){try{var p=localStorage.getItem('dh-theme')||'dark';var t=p==='system'?((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'):p;document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm active" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container-xxl" style="max-width:420px">
            <div class="card border-secondary">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-1 text-center">登入</h1>
                    <p class="text-muted small text-center mb-4">歡迎回來，駭客</p>
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label">帳號</label>
                            <input type="text" class="form-control" id="username" required>
                            <div class="invalid-feedback">請輸入帳號</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密碼</label>
                            <input type="password" class="form-control" id="password" required minlength="4">
                            <div class="invalid-feedback">密碼至少 4 個字</div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">登入</button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">還沒有帳號？<a href="register.html">註冊</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var u = document.getElementById('username');
            var p = document.getElementById('password');
            var ok = true;
            [u, p].forEach(function (f) {
                if (!f.checkValidity()) { f.classList.add('is-invalid'); ok = false; }
                else { f.classList.remove('is-invalid'); }
            });
            if (!ok) return;
            try { localStorage.setItem('dh-user', u.value); } catch (e) {}
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
