<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — Linux 基礎知識</title>
    
    <!-- 頁面載入時先檢查用戶的主題設定，立即套用亮/暗色主題 -->
    <script>
        (function () {
            try {
                // 從瀏覽器儲存空間取得主題設定，預設為 'dark'（暗色）
                var t = localStorage.getItem('dh-theme') || 'dark';
                // 設定 HTML 根元素的主題屬性，讓 CSS 立即套用
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <!-- 引入 Bootstrap 框架的 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引入自訂樣式 -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- 引入亮色主題覆蓋樣式 -->
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <div class="app-container">
        <!-- 動畫粒子效果容器 -->
        <div id="tsparticles"></div>
        
        <!-- 頁面載入動畫 -->
        <div id="loading">
            <img src="image/loading.gif" alt="Loading">
            <img src="image/loading2.gif" alt="Loading">
        </div>
        
        <!-- 頁面頂部標題欄 -->
        <header class="header">
            <!-- 左側導覽 -->
            <div class="header-left">
                <!-- 返回首頁按鈕 -->
                <a href="index.html" class="btn-back">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    返回
                </a>
                <div class="header-sep"></div>
                <!-- 網站品牌名稱 -->
                <div class="logo">Don't <span>HackMe</span></div>
                <!-- 房間資訊 -->
                <div class="room-meta">
                    <span class="room-badge">房間</span>
                    <span class="room-title-header">Linux 基礎知識</span>
                </div>
            </div>
            
            <!-- 右側控制區 -->
            <div class="header-right">
                <!-- 亮/暗主題切換開關 -->
                <div class="form-check form-switch d-flex align-items-center gap-1 m-0">
                    <span style="font-size:14px">🌙</span>
                    <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                    <span style="font-size:14px">☀️</span>
                </div>
                
                <!-- 進度條：顯示完成的任務數 -->
                <div class="progress-wrap">
                    <span class="progress-label" id="progressLabel">0 / 5 tasks</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width:0%"></div>
                    </div>
                </div>
                
                <!-- 分割畫面按鈕：切換題目和終端機並排顯示 -->
                <button class="btn-split" id="toggleTerminal">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="1" y="1" width="6" height="14" rx="1" fill="currentColor" opacity="0.5"/>
                        <rect x="9" y="1" width="6" height="14" rx="1" fill="currentColor"/>
                    </svg>
                    Split View
                </button>
            </div>
        </header>

        <!-- 主要內容區域 -->
        <main class="main-content" id="mainContent">

            <!-- 題目面板：顯示房間資訊和問題 -->
            <section class="question-panel" id="questionPanel">
                <!-- 房間介紹卡片 -->
                <div class="room-info-card">
                    <div class="room-info-header">
                        <!-- 房間圖標 -->
                        <div class="room-icon">🐧</div>
                        <div>
                            <!-- 房間標題 -->
                            <h1 class="room-name">Linux 基礎知識</h1>
                            <!-- 房間描述 -->
                            <p class="room-desc">本課程將學習到基礎的 Linux 相關指令知識，完成任務才可以解鎖下一個。</p>
                            <!-- 房間標籤 -->
                            <div class="tag-list">
                                <span class="tag">Linux</span>
                                <span class="tag">Beginner</span>
                                <span class="tag">Terminal</span>
                                <span class="tag">CLI</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 任務列表會由 JavaScript 動態生成 -->
                <div class="tasks-list" id="tasksList"></div>
            </section>

            <!-- 題目和終端機之間的分隔線（用於分割檢視） -->
            <div class="divider" id="divider"></div>

            <!-- 終端機面板：模擬 Linux 命令列環境 -->
            <section class="terminal-panel hidden" id="terminalPanel">
                <!-- 終端機視窗的標題欄（仿 macOS 風格） -->
                <div class="terminal-chrome">
                    <!-- 三個彩色圓點 -->
                    <div class="chrome-dots">
                        <span class="dot dot-red"></span>
                        <span class="dot dot-yellow"></span>
                        <span class="dot dot-green"></span>
                    </div>
                    <!-- 終端機使用者顯示 -->
                    <span class="chrome-title" id="chromeTitle">slime@slimebvs.net: ~</span>
                    <!-- 關閉終端機按鈕 -->
                    <button class="btn-close" id="closeTerminal" title="Close terminal">✕</button>
                </div>
                <!-- 終端機主體區域 -->
                <div class="terminal-body" id="terminalBody">
                    <!-- 命令輸出顯示區域 -->
                    <div class="terminal-output" id="terminalOutput"></div>
                    <!-- 命令輸入區域 -->
                    <div class="terminal-input-row" id="terminalInputRow">
                        <!-- 終端機提示符 -->
                        <span class="prompt" id="promptText">slime@slimebvs.net:~$&nbsp;</span>
                        <!-- 輸入框：用戶輸入命令 -->
                        <input type="text" id="terminalInput" class="terminal-input"
                               autocomplete="off" spellcheck="false"
                               autocorrect="off" autocapitalize="off">
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- 頁尾：版權資訊 -->
    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <!-- 引入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入終端機模擬邏輯 -->
    <script src="js/terminal.js"></script>
    <!-- 引入房間應用程式邏輯 -->
    <script src="js/app.js"></script>
    <!-- 引入主題切換邏輯 -->
    <script src="js/theme.js"></script>
    <!-- 引入動畫效果 -->
    <script src="js/ani.js"></script>
</body>
</html>
