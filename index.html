<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary"
         style="background:rgba(22,27,34,0.95);backdrop-filter:blur(12px)">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">
                Don't <span class="text-primary">HackMe</span>
            </a>
            <button class="navbar-toggler border-secondary" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link active" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="#rooms">題目庫</a></li>
                    <li class="nav-item"><a class="nav-link" href="#paths">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <div class="nav-avatar">S</div>
                    <span class="text-secondary small">slime</span>
                </div>
            </div>
        </div>
    </nav>

    <main>

        <!-- Hero -->
        <section class="py-5">
            <div class="container-xxl">
                <div class="row align-items-center g-5 py-4">

                    <div class="col-lg-6">
                        <span class="badge border border-primary text-primary fw-normal px-3 py-2 mb-4 d-inline-block">
                            🚩 互動式資安學習平台
                        </span>
                        <h1 class="hero-title mb-3">
                            從零開始，<br>
                            <span class="hero-gradient">學習資安知識</span>
                        </h1>
                        <p class="text-secondary mb-4" style="font-size:16px;line-height:1.8;max-width:480px">
                            透過模擬的 Linux 終端機環境，完成挑戰題目，<br>
                            一步步建立你的資安技能樹。
                        </p>
                        <div class="d-flex gap-3 flex-wrap mb-5">
                            <a href="#rooms" class="btn btn-primary px-4 py-2 fw-semibold">開始學習</a>
                            <a href="#paths" class="btn btn-outline-secondary px-4 py-2 fw-semibold">查看學習路徑</a>
                        </div>

                    </div>

                    <div class="col-lg-5 ms-auto">
                        <div class="hero-terminal">
                            <div class="ht-chrome">
                                <div class="ht-dots">
                                    <span class="ht-dot" style="background:#ff5f56"></span>
                                    <span class="ht-dot" style="background:#ffbd2e"></span>
                                    <span class="ht-dot" style="background:#27c93f"></span>
                                </div>
                                <span class="ht-title">slime@slimebvs.net: ~</span>
                            </div>
                            <div class="ht-body" id="heroTerminal">
                                <div class="ht-cursor-wrap"><span id="heroTerminalContent"></span><span class="ht-cursor"></span></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Learning Paths -->
        <section class="py-5 border-top border-secondary" id="paths">
            <div class="container-xxl">
                <div class="mb-4">
                    <h2 class="fw-bold mb-1">學習路徑</h2>
                    <p class="text-muted small mb-0">按照路徑系統性地學習，效率最大化</p>
                </div>
                <div class="row g-3" id="pathsGrid"></div>
            </div>
        </section>

        <!-- Rooms -->
        <section class="py-5 border-top border-secondary" id="rooms">
            <div class="container-xxl">
                <div class="d-flex align-items-end justify-content-between flex-wrap gap-3 mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">所有房間</h2>
                        <p class="text-muted small mb-0">選擇一個房間，開啟你的挑戰</p>
                    </div>
                    <div class="btn-group btn-group-sm" role="group" id="filterGroup">
                        <button class="btn btn-primary active" data-filter="all">全部</button>
                        <button class="btn btn-outline-secondary" data-filter="beginner">初級</button>
                        <button class="btn btn-outline-secondary" data-filter="intermediate">中級</button>
                    </div>
                </div>
                <div class="row g-3" id="roomsGrid"></div>
            </div>
        </section>

    </main>

    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">純前端互動學習平台 © 2026</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
