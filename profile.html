<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 個人檔案</title>
    
    <!-- 頁面載入時先檢查用戶的主題設定，支援亮/暗/跟隨系統三種模式 -->
    <script>
        (function () {
            try {
                // 取得使用者儲存的主題偏好設定，預設為 'dark'
                var p = localStorage.getItem('dh-theme') || 'dark';
                // 如果選擇「跟隨系統」，則檢查系統是否為亮色或暗色
                var t = p === 'system' ?
                    ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark') : p;
                // 套用主題到 HTML 根元素
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    
    <!-- 引入 Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引入���訂樣式 -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- 引入亮色主題覆蓋樣式 -->
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            
            <!-- 亮/暗主題快速切換開關 -->
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            
            <!-- 手機版導覽列按鈕 -->
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- 導覽列選單項目 -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <!-- 個人頁面是當前頁面，標記為 active -->
                    <a class="nav-link active" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區域 -->
    <main class="py-5">
        <div class="container-xxl" style="max-width:820px">
            <!-- 個人檔案內容會由 JavaScript 動態生成 -->
            <div id="profileContent"></div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <!-- 引入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入題目和房間資料 -->
    <script src="js/data.js"></script>
    <!-- 引入主題切換邏輯 -->
    <script src="js/theme.js"></script>
    
    <!-- 個人檔案頁面的邏輯 -->
    <script>
        (function () {
            // 嘗試從瀏覽器儲存空間取得登入的使用者名稱
            var user;
            try {
                user = localStorage.getItem('dh-user');
            } catch (e) {}
            
            // 取得要填充內容的容器元素
            var el = document.getElementById('profileContent');
            
            // 用來轉義 HTML 特殊字元，防止 XSS 攻擊（惡意注入程式碼）
            function esc(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }
            
            // 根據房間 ID 查詢使用者答對的題目數量
            function answered(id) {
                try {
                    // 從瀏覽器儲存空間取得該房間的進度資訊
                    var r = localStorage.getItem('progress_room_' + id);
                    // 如果有進度資訊，計算已回答的題目數量
                    return r ? Object.keys(JSON.parse(r)).length : 0;
                } catch (e) {
                    return 0;
                }
            }

            // 如果使用者沒有登入，顯示鎖定圖示和登入按鈕
            if (!user) {
                el.innerHTML = '<div class="text-center py-5"><div class="fs-1 mb-2">🔒</div><p class="text-muted">你還沒登入</p><a class="btn btn-primary" href="login.html">前往登入</a></div>';
                return;
            }

            // 為每個房間生成進度卡片
            var cards = ROOMS.map(function (room) {
                // 取得該房間的已回答題目數
                var a = answered(room.id);
                // 計算完成百分比
                var pct = room.totalQuestions ? Math.round(a / room.totalQuestions * 100) : 0;
                
                // 如果完成度為 100%，使用綠色標籤；否則用灰色
                return '<div class="col-md-6"><div class="card h-100 border-secondary"><div class="card-body">'
                    + '<div class="d-flex justify-content-between align-items-start"><span class="fs-3">' + room.icon + '</span>'
                    + '<span class="badge ' + (pct === 100 ? 'bg-success' : 'bg-secondary') + '">' + pct + '%</span></div>'
                    + '<h6 class="fw-bold mt-2 mb-1">' + room.title + '</h6>'
                    // 進度條顯示完成百分比
                    + '<div class="progress mt-2" style="height:5px"><div class="progress-bar" style="width:' + pct + '%"></div></div>'
                    // 顯示完成的題目數和總題目數
                    + '<div class="text-muted small mt-1">' + a + ' / ' + room.totalQuestions + ' 題完成</div>'
                    + '</div></div></div>';
            }).join('');

            // 計算總共完成的題目數
            var totalAnswered = ROOMS.reduce(function (s, r) {
                return s + answered(r.id);
            }, 0);
            
            // 計算已完全攻克（100% 完成）的房間數量
            var doneRooms = ROOMS.filter(function (r) {
                return r.totalQuestions && answered(r.id) >= r.totalQuestions;
            }).length;

            // 動態生成個人檔案內容
            el.innerHTML =
                // 使用者資訊區塊（頭像、名稱、統計資訊）
                '<div class="d-flex align-items-center gap-3 mb-4 flex-wrap">'
                // 漸層背景的圓形頭像
                + '<div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:64px;height:64px;background:linear-gradient(135deg,#58a6ff,#6e40c9);color:#fff;font-size:24px;">'
                + esc(user).charAt(0).toUpperCase() + '</div>'
                // 使用者名稱和統計資訊
                + '<div><h1 class="h4 fw-bold mb-0">' + esc(user) + '</h1><span class="text-muted small">已完成 ' + totalAnswered + ' 題 · 攻克 ' + doneRooms + ' 個房間</span></div>'
                // 登出按鈕
                + '<a class="btn btn-outline-secondary btn-sm ms-auto" href="#" id="logoutBtn">登出</a></div>'
                // 進度卡片區域
                + '<h5 class="fw-bold mb-3">我的進度</h5><div class="row g-3">' + cards + '</div>';

            // 為登出按鈕綁定點擊事件
            var lo = document.getElementById('logoutBtn');
            if (lo) {
                lo.addEventListener('click', function (e) {
                    e.preventDefault();
                    // 從瀏覽器儲存空間刪除使用者資訊
                    try {
                        localStorage.removeItem('dh-user');
                    } catch (e) {}
                    // 重新載入頁面
                    window.location.href = 'index.html';
                });
            }
        })();
    </script>
</body>
</html>
