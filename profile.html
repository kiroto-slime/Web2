<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't HackMe — 個人檔案</title>
    <script>(function(){try{var p=localStorage.getItem('dh-theme')||'dark';var t=p==='system'?((window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'):p;document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary app-navbar">
        <div class="container-xxl">
            <a class="navbar-brand fw-bold" href="index.html">Don't <span class="text-primary">HackMe</span></a>
            <div class="form-check form-switch d-flex align-items-center gap-1 m-0 ms-auto me-2 order-lg-last">
                <span style="font-size:14px">🌙</span>
                <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch">
                <span style="font-size:14px">☀️</span>
            </div>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="paths.html">學習路徑</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">排行榜</a></li>
                    <li class="nav-item"><a class="nav-link" href="game.html">小遊戲</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">關於</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a class="nav-link" href="settings.html">⚙️ 設定</a>
                    <a class="nav-link active" href="profile.html">個人</a>
                    <a class="btn btn-outline-primary btn-sm" href="login.html">登入</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container-xxl" style="max-width:820px">
            <div id="profileContent"></div>
        </div>
    </main>

    <footer class="border-top border-secondary py-4 mt-5">
        <div class="container-xxl d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="fw-bold">Don't HackMe</span>
            <span class="text-muted small">© 2026 319123施英彥. All rights reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            var user; try { user = localStorage.getItem('dh-user'); } catch (e) {}
            var el = document.getElementById('profileContent');
            function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            function answered(id){ try { var r = localStorage.getItem('progress_room_' + id); return r ? Object.keys(JSON.parse(r)).length : 0; } catch (e) { return 0; } }

            if (!user) {
                el.innerHTML = '<div class="text-center py-5"><div class="fs-1 mb-2">🔒</div><p class="text-muted">你還沒登入</p><a class="btn btn-primary" href="login.html">前往登入</a></div>';
                return;
            }

            var cards = ROOMS.map(function (room) {
                var a = answered(room.id);
                var pct = room.totalQuestions ? Math.round(a / room.totalQuestions * 100) : 0;
                return '<div class="col-md-6"><div class="card h-100 border-secondary"><div class="card-body">'
                    + '<div class="d-flex justify-content-between align-items-start"><span class="fs-3">' + room.icon + '</span>'
                    + '<span class="badge ' + (pct === 100 ? 'bg-success' : 'bg-secondary') + '">' + pct + '%</span></div>'
                    + '<h6 class="fw-bold mt-2 mb-1">' + room.title + '</h6>'
                    + '<div class="progress mt-2" style="height:5px"><div class="progress-bar" style="width:' + pct + '%"></div></div>'
                    + '<div class="text-muted small mt-1">' + a + ' / ' + room.totalQuestions + ' 題完成</div>'
                    + '</div></div></div>';
            }).join('');

            var totalAnswered = ROOMS.reduce(function (s, r) { return s + answered(r.id); }, 0);
            var doneRooms = ROOMS.filter(function (r) { return r.totalQuestions && answered(r.id) >= r.totalQuestions; }).length;

            el.innerHTML =
                '<div class="d-flex align-items-center gap-3 mb-4 flex-wrap">'
                + '<div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:64px;height:64px;background:linear-gradient(135deg,#58a6ff,#6e40c9);color:#fff;font-size:26px">' + esc(user.charAt(0).toUpperCase()) + '</div>'
                + '<div><h1 class="h4 fw-bold mb-0">' + esc(user) + '</h1><span class="text-muted small">已完成 ' + totalAnswered + ' 題 · 攻克 ' + doneRooms + ' 個房間</span></div>'
                + '<a class="btn btn-outline-secondary btn-sm ms-auto" href="#" id="logoutBtn">登出</a></div>'
                + '<h5 class="fw-bold mb-3">我的進度</h5><div class="row g-3">' + cards + '</div>';

            var lo = document.getElementById('logoutBtn');
            if (lo) lo.addEventListener('click', function (e) {
                e.preventDefault();
                try { localStorage.removeItem('dh-user'); } catch (e) {}
                window.location.href = 'index.html';
            });
        })();
    </script>
</body>
</html>
